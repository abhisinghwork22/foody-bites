name: Deploy Foody Bites to GCP Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to use GCP Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Extract Project ID
      id: project
      run: echo "PROJECT_ID=$(gcloud config get-value project)" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      run: |
        IMAGE_URI="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/foody-repo/foody-bites-app:${{ github.sha }}"
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    - name: Deploy to Google Cloud Run
      run: |
        gcloud run deploy foody-bites-service \
          --image=${{ env.IMAGE_URI }} \
          --platform=managed \
          --region=us-central1 \
          --allow-unauthenticated