name: Automated Terraform Infra Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'main.tf'
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform Init
      run: terraform init
    
    # FIX FOR ERROR 409: Import existing Artifact Registry repo into state before applying
    - name: Import Existing Repository (if already created)
      run: |
        PROJECT_ID=$(gcloud config get-value project)
        terraform import google_artifact_registry_repository.foody_repo projects/${PROJECT_ID}/locations/us-central1/repositories/foody-repo || true

    - name: Terraform Apply
      run: terraform apply -auto-approve